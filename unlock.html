<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Case study access</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/Favicon.svg?v=1" />
  <link rel="shortcut icon" href="assets/icons/Favicon.svg?v=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Manrope:wght@400;700&display=swap" rel="stylesheet" />
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YT43C40S0Z"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-YT43C40S0Z');</script>

  <!-- Salt, iteration count and verifier. Rewritten by tools/protect.py — do
       not edit by hand, or this page stops agreeing with the case studies.
       Public by design: none of it is the password. -->
  <script id="vy-config" type="application/json">{"salt": "MYOaFAaqVf4rNfE5C+rdJQ==", "iterations": 310000, "verify": "f+6fZhUS3i1l5/FXPjz45c56EBZ+tGp/17vSxHlLrP20RqXta+vAXA=="}</script>

  <style>
    html, body { margin: 0; }
    body {
      min-height: 100vh; background: #0a0a0a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 32px; padding: 24px; box-sizing: border-box;
    }
    .gate-head { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
    .gate-eyebrow {
      font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.35);
    }
    .gate-title {
      font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700;
      color: #fff; margin: 0;
    }
    .gate-form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
    #pw-input {
      width: 100%; padding: 14px 18px; box-sizing: border-box;
      font-family: 'Manrope', sans-serif; font-size: 15px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px; color: #fff; outline: none;
    }
    #pw-error {
      font-family: 'Manrope', sans-serif; font-size: 13px; color: #ff5f5f;
      display: none; margin: 0;
    }
    .gate-btn {
      width: 100%; padding: 14px;
      font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 700;
      border: none; border-radius: 10px; cursor: pointer;
      transition: opacity .2s ease;
    }
    .gate-btn:hover { opacity: .8; }
    .gate-btn[disabled] { opacity: .5; cursor: default; }
    .gate-btn-primary { background: #fff; color: #000; }
    .gate-btn-back { background: #000; color: #ababab; }

    /* Access request — offered after a few wrong passwords. */
    .req-overlay {
      position: fixed; inset: 0; z-index: 10;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      padding: 16px; box-sizing: border-box;
      opacity: 0; pointer-events: none; transition: opacity .25s ease;
    }
    .req-overlay.is-open { opacity: 1; pointer-events: auto; }
    .req-card {
      position: relative; width: 100%; max-width: 400px; box-sizing: border-box;
      max-height: calc(100vh - 32px); overflow-y: auto;
      background: #141414; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; padding: 32px 24px 24px;
      transform: translateY(12px); transition: transform .25s ease;
    }
    .req-overlay.is-open .req-card { transform: none; }
    .req-close {
      position: absolute; top: 12px; right: 12px;
      width: 32px; height: 32px; border: none; border-radius: 8px;
      background: transparent; color: rgba(255,255,255,0.5);
      font-size: 22px; line-height: 1; cursor: pointer;
    }
    .req-close:hover { color: #fff; background: rgba(255,255,255,0.07); }
    .req-title {
      font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700;
      color: #fff; margin: 0 0 8px;
    }
    .req-body {
      font-family: 'Manrope', sans-serif; font-size: 15px; line-height: 1.5;
      color: rgba(255,255,255,0.6); margin: 0 0 20px;
    }
    .req-form { display: flex; flex-direction: column; gap: 12px; }
    .req-form input, .req-form textarea {
      width: 100%; padding: 14px 18px; box-sizing: border-box;
      font-family: 'Manrope', sans-serif; font-size: 15px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px; color: #fff; outline: none; resize: vertical;
    }
    .req-form input:focus, .req-form textarea:focus, #pw-input:focus { border-color: rgba(255,255,255,0.4); }
    .req-form textarea { min-height: 96px; }
    .req-hp { position: absolute; left: -9999px; }
    #req-status {
      font-family: 'Manrope', sans-serif; font-size: 13px; color: #ff5f5f;
      display: none; margin: 0;
    }
    .req-done { display: none; }
    .req-card.is-sent .req-form, .req-card.is-sent > .req-body { display: none; }
    .req-card.is-sent .req-done { display: block; }
    .gate-request {
      font-family: 'Manrope', sans-serif; font-size: 13px; color: rgba(255,255,255,0.5);
      background: none; border: none; padding: 4px; cursor: pointer;
      text-decoration: underline; text-underline-offset: 3px; display: none;
    }
    .gate-request:hover { color: #fff; }
  </style>
</head>
<body>

  <div class="gate-head">
    <span class="gate-eyebrow" id="gate-eyebrow">Case study</span>
    <h1 class="gate-title">Case study access</h1>
  </div>

  <form class="gate-form" id="gate-form">
    <input id="pw-input" type="password" placeholder="Enter password"
           autocomplete="current-password" autofocus />
    <p id="pw-error">Incorrect password. Try again.</p>
    <button type="submit" class="gate-btn gate-btn-primary" id="gate-submit">Continue</button>
    <button type="button" class="gate-btn gate-btn-back" id="gate-back">Back to previous</button>
    <button type="button" class="gate-request" id="gate-request">Don't have the password? Request access</button>
  </form>

  <div class="req-overlay" id="req-overlay" aria-hidden="true">
    <div class="req-card" id="req-card" role="dialog" aria-modal="true" aria-labelledby="req-title">
      <button type="button" class="req-close" id="req-close" aria-label="Close">&times;</button>
      <h2 class="req-title" id="req-title">Interested?</h2>
      <p class="req-body">Fill out this form if you'd like to get access.</p>
      <form class="req-form" id="req-form" novalidate>
        <input name="name" type="text" placeholder="Name" autocomplete="name" required />
        <input name="email" type="email" placeholder="Email address" autocomplete="email" required />
        <textarea name="message" placeholder="Message (optional)"></textarea>
        <!-- Honeypot: humans never see it, bots fill it in. -->
        <input class="req-hp" name="_honey" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <p id="req-status"></p>
        <button type="submit" class="gate-btn gate-btn-primary" id="req-submit">Request access</button>
      </form>
      <div class="req-done">
        <p class="req-body">Thanks — your request is in. You'll hear back by email.</p>
        <button type="button" class="gate-btn gate-btn-primary" id="req-ok">Close</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var KEY_NAME = 'vy-case-key';
      var cfg = JSON.parse(document.getElementById('vy-config').textContent);

      // Which study was asked for, so the gate keeps the branding and the
      // analytics event the old per-page overlays had.
      var STUDIES = [
        ['/case-studies/hmi/',                     'Denon',              'hmi'],
        ['/case-studies/audio-experience/',        'Audio experience',   'audio-experience'],
        ['/case-studies/bw/app-experience',        'Bowers & Wilkins',   'bw_app_experience'],
        ['/case-studies/bw/ia-case-study',         'Bowers & Wilkins',   'bw_ia_case_study'],
        ['/case-studies/bw/product-experience',    'Bowers & Wilkins',   'bw_product_experience'],
        ['/case-studies/bw/unboxing',              'Bowers & Wilkins',   'bw_unboxing']
      ];

      // Only same-origin absolute paths. Without this check the ?next= on a
      // link someone else wrote could bounce a visitor off the site.
      function safeNext() {
        var raw = new URLSearchParams(location.search).get('next') || '';
        try { raw = decodeURIComponent(raw); } catch (e) { return null; }
        if (!/^\/[^\/\\]/.test(raw)) return null;
        return raw;
      }

      var next = safeNext();
      var study = next && STUDIES.filter(function (s) { return next.indexOf(s[0]) === 0; })[0];
      if (study) document.getElementById('gate-eyebrow').textContent = study[1];

      var input = document.getElementById('pw-input');
      var error = document.getElementById('pw-error');
      var submit = document.getElementById('gate-submit');

      function bytes(b64) {
        var raw = atob(b64.replace(/\s+/g, ''));
        var out = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
        return out;
      }

      function b64(buf) {
        var arr = new Uint8Array(buf), s = '';
        for (var i = 0; i < arr.length; i++) s += String.fromCharCode(arr[i]);
        return btoa(s);
      }

      // Same derivation as tools/protect.py: PBKDF2-SHA256 over the shared
      // salt. One unlock therefore opens every case study in the session.
      async function deriveKey(password) {
        var material = await crypto.subtle.importKey(
          'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
        );
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: bytes(cfg.salt), iterations: cfg.iterations, hash: 'SHA-256' },
          material,
          { name: 'AES-GCM', length: 256 },
          true,
          ['decrypt']
        );
      }

      // The verifier decrypts to a known token, so a wrong password is caught
      // here rather than as a broken-looking case study page.
      async function isCorrect(key) {
        var blob = bytes(cfg.verify);
        try {
          var out = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: blob.subarray(0, 12) }, key, blob.subarray(12)
          );
          return new TextDecoder().decode(out) === 'vy-unlock-ok';
        } catch (e) {
          return false;
        }
      }

      // After this many wrong passwords, offer the access request form. The
      // count lives in sessionStorage so reloading the gate doesn't reset it.
      var FAILS_BEFORE_REQUEST = 3;
      var FAILS_NAME = 'vy-unlock-fails';
      // Static site, so a form relay delivers the request by email. The first
      // submission sends a one-time activation link to this address.
      var REQUEST_ENDPOINT = 'https://formsubmit.co/ajax/hi@yvefa.com';

      function failCount() {
        try { return parseInt(sessionStorage.getItem(FAILS_NAME), 10) || 0; } catch (e) { return 0; }
      }

      var overlay = document.getElementById('req-overlay');
      var card = document.getElementById('req-card');
      var reqForm = document.getElementById('req-form');
      var reqStatus = document.getElementById('req-status');
      var reqSubmit = document.getElementById('req-submit');
      var reqLink = document.getElementById('gate-request');

      function openRequest() {
        overlay.classList.add('is-open');
        overlay.setAttribute('aria-hidden', 'false');
        reqLink.style.display = 'block';
        (card.classList.contains('is-sent') ? document.getElementById('req-ok') : reqForm.elements.name).focus();
        gtag('event', 'case_study_request_shown', { case_study: study ? study[2] : 'unknown' });
      }

      function closeRequest() {
        overlay.classList.remove('is-open');
        overlay.setAttribute('aria-hidden', 'true');
        input.focus();
      }

      if (failCount() >= FAILS_BEFORE_REQUEST) reqLink.style.display = 'block';
      reqLink.addEventListener('click', openRequest);
      document.getElementById('req-close').addEventListener('click', closeRequest);
      document.getElementById('req-ok').addEventListener('click', closeRequest);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) closeRequest(); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && overlay.classList.contains('is-open')) closeRequest();
      });

      reqForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        var f = reqForm.elements;
        var name = f.name.value.trim(), email = f.email.value.trim();
        reqStatus.style.display = 'none';
        if (!name || !f.email.checkValidity() || !email) {
          reqStatus.textContent = 'Please add your name and a valid email address.';
          reqStatus.style.display = 'block';
          return;
        }
        if (f._honey.value) return;

        reqSubmit.disabled = true;
        reqSubmit.textContent = 'Sending…';
        try {
          var res = await fetch(REQUEST_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
              name: name,
              email: email,
              message: f.message.value.trim(),
              case_study: study ? study[1] + ' (' + next + ')' : 'unknown',
              _subject: 'Case study access request — ' + name,
              _replyto: email,
              _template: 'table',
              _captcha: 'false'
            })
          });
          if (!res.ok) throw new Error(res.status);
          card.classList.add('is-sent');
          document.getElementById('req-ok').focus();
          gtag('event', 'case_study_request_sent', { case_study: study ? study[2] : 'unknown' });
        } catch (err) {
          reqStatus.textContent = 'Something went wrong. Please email hi@yvefa.com instead.';
          reqStatus.style.display = 'block';
        }
        reqSubmit.disabled = false;
        reqSubmit.textContent = 'Request access';
      });

      function reject() {
        gtag('event', 'case_study_unlock_failed', { case_study: study ? study[2] : 'unknown' });
        error.style.display = 'block';
        input.value = '';
        var fails = failCount() + 1;
        try { sessionStorage.setItem(FAILS_NAME, String(fails)); } catch (e) {}
        // Pop it on the 3rd miss, and again every 3 after, until they've sent one.
        if (fails % FAILS_BEFORE_REQUEST === 0 && !card.classList.contains('is-sent')) openRequest();
        else input.focus();
      }

      var form = document.getElementById('gate-form');
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        if (!input.value) return;

        // PBKDF2 at this iteration count takes a moment on a phone.
        error.style.display = 'none';
        submit.disabled = true;
        submit.textContent = 'Unlocking…';

        var key = await deriveKey(input.value);
        var ok = await isCorrect(key);

        submit.disabled = false;
        submit.textContent = 'Continue';
        if (!ok) return reject();

        // The key itself is what travels, not an "unlocked" flag — the case
        // study pages have nothing to read without it.
        var raw = b64(await crypto.subtle.exportKey('raw', key));
        try { sessionStorage.setItem(KEY_NAME, raw); } catch (err) {
          error.textContent = 'This browser is blocking session storage, so the case study cannot be opened.';
          error.style.display = 'block';
          return;
        }

        try { sessionStorage.removeItem(FAILS_NAME); } catch (err) {}
        gtag('event', 'case_study_unlock', { case_study: study ? study[2] : 'unknown' });
        location.replace(next || 'index.html');
      });

      // The old per-page gate submitted on Enter; implicit form submission is
      // not reliable enough across browsers to drop that.
      input.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        if (form.requestSubmit) form.requestSubmit();
        else form.dispatchEvent(new Event('submit', { cancelable: true }));
      });

      document.getElementById('gate-back').addEventListener('click', function () {
        // history.back() would land on the case study, which bounces straight
        // back here — so leaving the gate means leaving for the homepage.
        try { sessionStorage.setItem('pt-arriving', '1'); } catch (err) {}
        location.replace('index.html');
      });
    })();
  </script>

</body>
</html>
