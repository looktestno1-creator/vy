<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Vefa Yilmaz</title>
  <link rel="icon" type="image/svg+xml" href="/assets/icons/Favicon.svg?v=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Manrope:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f1f2f4;
      font-family: 'Manrope', sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 24px;
      padding: 40px;
      max-width: 480px;
    }
    .num {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #8a8a8a;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(36px, 6vw, 56px);
      font-weight: 700;
      line-height: 1.05;
      color: #000;
    }
    p {
      font-size: 16px;
      line-height: 1.7;
      color: #5a5a5a;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: #000;
      color: #fff;
      font-family: 'Manrope', sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 100px;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.7; }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="num">404</span>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/">Back to home</a>
  </div>
</body>
</html>
